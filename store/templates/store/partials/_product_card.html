<article class="product-card"><a class="product-media" href="{{ product.get_absolute_url }}">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}">{% else %}<div class="image-placeholder"><span>{{ product.name|slice:':1' }}</span></div>{% endif %}{% include 'store/partials/_stock_badge.html' %}</a><div class="product-body"><div class="eyebrow">{{ product.category.name }}</div><h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3><p>{{ product.description|truncatewords:14 }}</p><div class="card-foot"><strong>₱{{ product.price|floatformat:2 }}</strong>{% if product.stock %}<button class="btn btn-dark btn-small" hx-post="{% url 'add_to_cart' product.pk %}" hx-vals='{"quantity":1}' hx-target="#feedback-{{ product.pk }}" hx-swap="innerHTML" hx-indicator="#global-indicator">Add to cart</button>{% else %}<button class="btn btn-muted btn-small" disabled>Unavailable</button>{% endif %}</div><div id="feedback-{{ product.pk }}"></div></div></article>
