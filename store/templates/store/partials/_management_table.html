<div class="table-wrap"><table class="manage-table"><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>{% for p in products %}<tr id="product-row-{{ p.pk }}"><td>#{{ p.pk }}</td><td><strong>{{ p.name }}</strong></td><td>{{ p.category.name }}</td><td>₱{{ p.price|floatformat:2 }}</td><td>{{ p.stock }}</td><td><span class="status {{ p.stock_class }}">{{ p.stock_label }}</span></td><td class="actions"><a href="{% url 'product_edit' p.pk %}">Edit</a><button hx-delete="{% url 'product_delete' p.pk %}" hx-confirm="Delete {{ p.name }}?" hx-target="#management-table" hx-swap="innerHTML" hx-indicator="#global-indicator">Delete</button></td></tr>{% empty %}<tr><td colspan="7"><div class="empty-table">No products match your search.</div></td></tr>{% endfor %}</tbody></table></div>
